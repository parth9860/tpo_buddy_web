[build]
  command = "node scripts/build-static-site.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Canonical page routing & redirects
[[redirects]]
  from = "/index.jsp"
  to = "/index.html"
  status = 200

